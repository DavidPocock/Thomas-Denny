<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Denny Glass">
<meta name="theme-color" content="#7C2A2A">
<title>Thomas Denny Windows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F1EADA; --parchment-deep:#E7DCC3; --stone:#DCD1B2; --stone-line:#B7A87E;
    --ink:#262019; --ink-soft:#5C5340; --wine:#7C2A2A; --wine-deep:#5E1F1F;
    --lead:#55606A; --lead-soft:#8B95A0; --gold:#A9812E; --paper:#FBF8F0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--parchment); color:var(--ink); font-family:'Source Sans 3',sans-serif; }
  .app{ max-width:1100px; margin:0 auto; padding:22px 16px 60px; }
  h1{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:34px; margin:0 0 6px; }
  h2{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:24px; margin:0; }
  .tagline{ font-size:14.5px; color:var(--ink-soft); margin:0 0 14px; line-height:1.45; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .tool{ background:var(--paper); border:1px solid var(--stone-line); border-radius:4px; padding:7px 12px; font:600 13px 'Source Sans 3',sans-serif; color:var(--wine); cursor:pointer; }
  .you-dot{ fill:#2B6CB0; stroke:#fff; stroke-width:2; }
  .you-halo{ fill:rgba(43,108,176,0.18); }
  .dist{ color:#2B6CB0; font-weight:600; }
  .nearest{ font-size:14px; color:var(--ink-soft); margin-top:8px; }
  .tabs{ display:flex; gap:4px; border-bottom:2px solid var(--stone-line); margin:0 0 18px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab{ flex:1 1 0; background:none; border:none; font:600 13px 'Source Sans 3',sans-serif; color:var(--ink-soft);
        padding:10px 4px 9px; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap; }
  .tab.active{ color:var(--wine); border-bottom-color:var(--wine); }
  .tab small{ display:block; font-weight:500; font-size:11.5px; color:var(--lead); }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{ background:var(--paper); border:1px solid var(--stone-line); border-radius:6px; padding:16px; margin-bottom:16px; }
  .progress-wrap{ display:flex; align-items:baseline; gap:10px; font-size:18px; }
  .progress-wrap b{ font-family:'Cormorant Garamond',serif; font-size:30px; color:var(--wine); }
  .bar{ height:8px; background:var(--stone); border-radius:4px; overflow:hidden; margin-top:10px; }
  .bar span{ display:block; height:100%; width:0; background:var(--wine); transition:width .4s; }

  .region-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .region-card{ background:var(--paper); border:1px solid var(--stone-line); border-radius:6px; padding:14px; cursor:pointer; text-align:left; font-family:inherit; }
  .region-card:hover{ background:var(--parchment-deep); }
  .region-card h3{ font-family:'Cormorant Garamond',serif; font-size:21px; margin:0 0 4px; }
  .region-card .count{ font-size:14px; color:var(--ink-soft); }
  .region-card .mini{ height:6px; background:var(--stone); border-radius:3px; margin-top:8px; overflow:hidden; }
  .region-card .mini span{ display:block; height:100%; background:var(--wine); }

  .map-card svg{ width:100%; height:auto; display:block; }
  #map-home{ max-width:240px; margin:0 auto; }
  .outline{ fill:var(--stone); stroke:var(--stone-line); stroke-width:1.2; }
  .dot{ fill:var(--lead-soft); stroke:var(--paper); stroke-width:1.5; cursor:pointer; }
  .dot.visited{ fill:var(--wine); }
  .grp.selected .dot{ stroke:var(--gold); stroke-width:2.5; }
  .grp{ cursor:pointer; }
  .home-region{ cursor:pointer; }
  .hit{ fill:transparent; }
  .home-region:hover .hit{ fill:rgba(169,129,46,0.12); }
  .home-region:hover .dot{ stroke:var(--gold); }
  .region-lbl{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:14px; fill:var(--ink); text-anchor:middle; paint-order:stroke; stroke:var(--paper); stroke-width:3px; pointer-events:none; }
  .town-mark{ fill:var(--ink-soft); pointer-events:none; }
  .town-lbl{ font-family:'Source Sans 3',sans-serif; font-weight:600; fill:var(--ink-soft); pointer-events:none; }
  .num{ font-family:'Source Sans 3',sans-serif; font-weight:700; fill:#fff; text-anchor:middle; pointer-events:none; }
  .legend{  display:flex; gap:18px; font-size:13px; color:var(--ink-soft); margin-top:8px; }
  .swatch{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .swatch.v{ background:var(--wine); } .swatch.u{ background:var(--lead-soft); }

  .info{ background:var(--parchment-deep); border:1px solid var(--stone-line); border-radius:4px; padding:12px 14px; margin-bottom:12px; font-size:14px; }
  .info-empty{ color:var(--ink-soft); font-style:italic; }
  .info-close{ float:right; background:none; border:none; font-size:20px; line-height:1; color:var(--ink-soft); cursor:pointer; padding:0 0 0 10px; }
  .info-name{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; }
  .info-meta{ color:var(--ink-soft); margin:2px 0 6px; }
  .info-status{ font-weight:600; font-size:13px; margin-left:8px; }
  .info-status.v{ color:var(--wine); } .info-status.u{ color:var(--lead); }
  .info-image{ display:block; width:100%; max-height:260px; object-fit:cover; margin-top:10px; border:1px solid var(--stone-line); border-radius:3px; }
  .links{ margin-top:8px; font-size:12.5px; }
  .links a{ color:var(--wine); font-weight:600; text-decoration:underline; text-underline-offset:2px; }

  .list-head{ display:flex; justify-content:space-between; align-items:baseline; padding-bottom:8px; border-bottom:1px solid var(--stone-line); margin-bottom:4px; }
  .list-head small{ font-size:13px; color:var(--ink-soft); }
  ul.list{ list-style:none; margin:0; padding:0; }
  ul.list li{ padding:10px 4px; font-size:14.5px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; border-bottom:1px solid var(--stone); cursor:pointer; }
  ul.list li:last-child{ border-bottom:none; }
  ul.list li:hover{ background:var(--parchment-deep); }
  ul.list li.selected{ background:var(--parchment-deep); box-shadow:inset 3px 0 0 var(--wine); }
  .entry{ display:flex; flex-direction:column; gap:3px; }
  .badge{ display:inline-block; min-width:20px; height:20px; border-radius:10px; background:var(--lead-soft); color:#fff; font-size:12px; font-weight:700; text-align:center; line-height:20px; margin-right:7px; padding:0 5px; vertical-align:1px; }
  li.is-seen .badge, .info .badge.v{ background:var(--wine); }
  .nm{ font-weight:600; } .nm .city{ font-weight:400; color:var(--ink-soft); font-size:13px; margin-left:6px; }
  .hl{ color:var(--ink-soft); font-size:12.5px; font-style:italic; line-height:1.4; }
  .mark{ flex:none; font-size:12.5px; color:var(--lead); text-decoration:underline; white-space:nowrap; padding-top:2px; }
  .empty{ font-style:italic; color:var(--ink-soft); padding:8px 4px; }

  footer{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:20px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap; }
  #linkNote{ color:var(--wine); display:block; width:100%; }
  .reset{ background:var(--paper); border:1px solid var(--stone-line); border-radius:4px; padding:7px 12px; font:600 13px 'Source Sans 3',sans-serif; color:var(--ink-soft); cursor:pointer; }

  @media (min-width:820px){
    .region-body{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    h1{ font-size:40px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>The Windows of Thomas Denny</h1>

  <div class="toolbar">
    <button class="tool" id="locateBtn">Show my location</button>
    <button class="tool" id="sortBtn" style="display:none">Sort: newest first</button>
  </div>
  <div style="margin:-4px 0 12px;font-size:13px;color:var(--ink-soft);">
    <label for="startFrom">Or start directions from: </label>
    <input id="startFrom" type="text" placeholder="postcode or town" autocomplete="off" style="font:inherit;padding:5px 8px;border:1px solid #bbb;border-radius:8px;width:170px;max-width:60%;">
  </div>
  <div id="locNote" style="font-size:13px;color:var(--ink-soft);margin:-4px 0 12px;"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>

  <footer>
    <span id="linkNote"></span>
    <span id="storageNotice">Your progress is saved automatically.</span>
    <button class="reset" id="resetBtn">Reset all</button>
  </footer>
</div>

let activeTab = "home";
let userPos = null;      // {lat, lon}
let sortNearest = false;
const P = { x0:10, y0:10, kx:41.0, ky:70.0, lon0:-6.2, lat0:59.0 };
function toXY(lat, lon){ return { x: (lon - P.lon0) * P.kx + P.x0, y: (P.lat0 - lat) * P.ky + P.y0 }; }
function toLatLon(x, y){ return { lat: P.lat0 - (y - P.y0) / P.ky, lon: (x - P.x0) / P.kx + P.lon0 }; }
function milesTo(c){
  if(!userPos || c.abroad) return null;
  const a = toLatLon(c.x, c.y), R = 3958.8, toRad = d => d * Math.PI / 180;
  const dLat = toRad(a.lat - userPos.lat), dLon = toRad(a.lon - userPos.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(userPos.lat)) * Math.cos(toRad(a.lat)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function fmtMiles(m){ return m == null ? "" : (m < 10 ? m.toFixed(1) : Math.round(m)) + " miles"; }
let manualStart = "";
try{ manualStart = localStorage.getItem("dennyStartFrom") || ""; } catch(e){}
function originParam(){ return manualStart ? manualStart : (userPos ? userPos.lat.toFixed(5) + "," + userPos.lon.toFixed(5) : ""); }
function directionsLink(c){
  const o = originParam();
  return "https://www.google.com/maps/dir/?api=1" + (o ? "&origin=" + encodeURIComponent(o) : "") + "&destination=" + encodeURIComponent(c.name + ", " + c.city) + "&travelmode=driving";
}
function updateLocNote(acc){
  const n = document.getElementById("locNote"); if(!n) return;
  if(manualStart) n.textContent = "Directions will start from: " + manualStart + ".";
  else if(userPos) n.textContent = "Directions will start from your device's position, " + userPos.lat.toFixed(4) + ", " + userPos.lon.toFixed(4) + (acc ? " (accurate to about " + (acc >= 1000 ? (acc/1000).toFixed(1) + " km" : Math.round(acc) + " m") + ")" : "") + ".";
  else n.textContent = "";
}

// Directions always start from the user's current position once it is known
document.addEventListener("click", e => {
  const l = e.target.closest && e.target.closest('a[href*="google.com/maps/dir/"]');
  if(!l) return;
  const u = new URL(l.href), o = originParam();
  if(o) u.searchParams.set("origin", o); else u.searchParams.delete("origin");
  l.href = u.toString();
}, true);
function locate(){
  const btn = document.getElementById("locateBtn");
  if(!navigator.geolocation){ btn.textContent = "Location not supported here"; return; }
  btn.textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(pos => {
    userPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    btn.textContent = "Update my location";
    updateLocNote(pos.coords.accuracy);
    document.getElementById("sortBtn").style.display = "";
    render();
  }, err => {
    btn.textContent = err.code === 1 ? "Location permission refused" : "Couldn't get location";
    setTimeout(() => btn.textContent = "Show my location", 3000);
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}
function drawUserPin(svg, big){
  const svgNS = "http://www.w3.org/2000/svg";
  svg.querySelectorAll(".you").forEach(el => el.remove());
  if(!userPos) return;
  const pt = toXY(userPos.lat, userPos.lon);
  const vb = svg.viewBox.baseVal;
  if(pt.x < vb.x || pt.x > vb.x + vb.width || pt.y < vb.y || pt.y > vb.y + vb.height) return;
  const r = big ? vb.width / 48 : 6;
  const g = document.createElementNS(svgNS, "g"); g.setAttribute("class", "you");
  const halo = document.createElementNS(svgNS, "circle");
  halo.setAttribute("cx", pt.x); halo.setAttribute("cy", pt.y); halo.setAttribute("r", r * 2.2); halo.setAttribute("class", "you-halo");
  const dot = document.createElementNS(svgNS, "circle");
  dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y); dot.setAttribute("r", r); dot.setAttribute("class", "you-dot");
  g.appendChild(halo); g.appendChild(dot); svg.appendChild(g);
}
const outlinePts = OUTLINE.split(" ").map(p => p.split(",").map(Number));

function isVisited(id){ return !!visited[id]; }
function sitesIn(r){ return SITES.filter(s => s.region === r); }

/* ---------- storage ---------- */
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}
async function loadState(){
  build(); render();
  let raw = null;
  try{
    if(window.storage && typeof window.storage.get === "function"){
      storageMode = "artifact";
      const result = await withTimeout(window.storage.get(STORAGE_KEY, false), 4000);
      if(result && result.value) raw = result.value;
    } else {
      storageMode = "local";
      raw = localStorage.getItem(STORAGE_KEY);
    }
  } catch(e){
    if(storageMode === "artifact" && String(e.message) === "timeout") storageMode = "none";
  }
  if(raw){ try{ visited = JSON.parse(raw) || {}; } catch(e){ visited = {}; } }
  storageAvailable = storageMode !== "none";
  updateStorageNotice(); render();
}
async function save(){
  if(!storageAvailable) return;
  try{
    if(storageMode === "artifact"){
      const result = await withTimeout(window.storage.set(STORAGE_KEY, JSON.stringify(visited), false), 4000);
      if(!result) throw new Error("save failed");
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(visited));
    }
  } catch(e){ storageAvailable = false; updateStorageNotice(); }
}
function updateStorageNotice(){
  const el = document.getElementById("storageNotice");
  el.textContent = storageAvailable ? "Your progress is saved automatically." : "Progress isn't being saved on this device right now.";
}

/* ---------- links ---------- */
function photoLink(c){
  if(c.photos) return c.photos;
  return "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent("Thomas Denny stained glass " + c.name + " " + c.city.split(",")[0]);
}
function openLink(ev, url){
  let opened = null;
  try{ opened = window.open(url, "_blank", "noopener"); } catch(e){ opened = null; }
  if(opened){ ev.preventDefault(); return; }
  try{ ev.preventDefault(); window.location.assign(url); }
  catch(e){ document.getElementById("linkNote").textContent = "Links can't open inside this preview. Open the published page in Safari or Chrome, or press and hold the link."; }
}

          '</div>' +

  });

// Draws town markers and names, choosing for each the side that least overlaps dots, other names and the map edge.
function drawTowns(svg, vb, fs, dots, dotR, majorOnly, taken){
  const svgNS = "http://www.w3.org/2000/svg";
  const placed = taken || [];
  const m = fs * 0.28, gap = fs * 0.45;
  const hits = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  (majorOnly ? TOWNS.slice().sort((a,b) => (b[3]||0) - (a[3]||0)) : TOWNS).forEach(t => {
    if(majorOnly && !t[3]) return;
    const p = toXY(t[1], t[2]);
    if(p.x < vb[0] + 2 || p.x > vb[0] + vb[2] - 2 || p.y < vb[1] + 2 || p.y > vb[1] + vb[3] - 2) return;
    const tw = t[0].length * fs * 0.62, th = fs * 1.05;
    const cands = [
      {a:"start",  tx:p.x + gap,  ty:p.y + fs*0.35, x:p.x + gap,       y:p.y - th/2},
      {a:"end",    tx:p.x - gap,  ty:p.y + fs*0.35, x:p.x - gap - tw,  y:p.y - th/2},
      {a:"middle", tx:p.x,        ty:p.y - gap,     x:p.x - tw/2,      y:p.y - gap - th},
      {a:"middle", tx:p.x,        ty:p.y + gap + fs*0.8, x:p.x - tw/2, y:p.y + gap},
      {a:"start",  tx:p.x + gap,  ty:p.y - gap,          x:p.x + gap,      y:p.y - gap - th},
      {a:"start",  tx:p.x + gap,  ty:p.y + gap + fs*0.8, x:p.x + gap,      y:p.y + gap},
      {a:"end",    tx:p.x - gap,  ty:p.y - gap,          x:p.x - gap - tw, y:p.y - gap - th},
      {a:"end",    tx:p.x - gap,  ty:p.y + gap + fs*0.8, x:p.x - gap - tw, y:p.y + gap},
      {a:"middle", tx:p.x,        ty:p.y - dotR*1.15,            x:p.x - tw/2, y:p.y - dotR*1.15 - th},
      {a:"middle", tx:p.x,        ty:p.y + dotR*1.15 + fs*0.8,   x:p.x - tw/2, y:p.y + dotR*1.15}
    ];
    let best = null;
    cands.forEach(c => {
      const box = {x:c.x - fs*0.15, y:c.y - fs*0.1, w:tw + fs*0.3, h:th + fs*0.2};
      let score = 0;
      dots.forEach(d => { if(hits(box, {x:d.x - dotR, y:d.y - dotR, w:dotR*2, h:dotR*2})) score += 3; });
      placed.forEach(b => { if(hits(box, b)) score += 4; });
      if(box.x < vb[0] || box.x + box.w > vb[0] + vb[2] || box.y < vb[1] || box.y + box.h > vb[1] + vb[3]) score += 6;
      if(!best || score < best.score) best = {c, box, score};
    });
    const markBox = {x:p.x - m, y:p.y - m, w:m*2, h:m*2};
    const underDot = dots.some(d => Math.hypot(d.x - p.x, d.y - p.y) < dotR);
    if(best.score > 0 && t[3] !== 2) return;   // towns flagged 2 are always shown, in the least crowded spot   // no clean spot: leave this town off
    if(!underDot){
      const sq = document.createElementNS(svgNS, "rect");
      sq.setAttribute("x", p.x - m); sq.setAttribute("y", p.y - m); sq.setAttribute("width", m*2); sq.setAttribute("height", m*2);
      sq.setAttribute("class", "town-mark");
      svg.appendChild(sq);
    }
    const tx = document.createElementNS(svgNS, "text");
    tx.setAttribute("x", best.c.tx); tx.setAttribute("y", best.c.ty);
    tx.setAttribute("text-anchor", best.c.a); tx.setAttribute("font-size", fs); tx.setAttribute("class", "town-lbl");
    tx.textContent = t[0];
    svg.appendChild(tx);
    placed.push(best.box, markBox);
  });
}

function buildMap(region){
  const svg = document.getElementById("map-" + region);
  const svgNS = "http://www.w3.org/2000/svg";
  const sites = sitesIn(region);
  // viewBox from the sites in this region, with padding and a sensible aspect
  let minX = Math.min(...sites.map(s => s.x)), maxX = Math.max(...sites.map(s => s.x));
  let minY = Math.min(...sites.map(s => s.y)), maxY = Math.max(...sites.map(s => s.y));
  const pad = 28;
  let w = Math.max(maxX - minX + pad*2, 120), h = Math.max(maxY - minY + pad*2, 120);
  const aspect = 1.15; // height / width
  if(h / w < aspect) h = w * aspect; else w = h / aspect;
  const cx = (minX + maxX)/2, cy = (minY + maxY)/2;
  const vb = [cx - w/2, cy - h/2, w, h];
  svg.setAttribute("viewBox", vb.join(" "));
  const r = w / 34;
  const fs = r * 1.15;

  const shape = document.createElementNS(svgNS, "polygon");
  shape.setAttribute("points", OUTLINE);
  shape.setAttribute("class", "outline");
  svg.appendChild(shape);

  // nudge overlapping dots apart so every number stays readable
  const pos = sites.map(c => ({c, x:c.x, y:c.y}));
  for(let iter = 0; iter < 60; iter++){
    let moved = false;
    for(let i = 0; i < pos.length; i++) for(let j = i+1; j < pos.length; j++){
      const dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y;
      const d = Math.hypot(dx, dy) || 0.01, min = r * 2.25;
      if(d < min){
        const push = (min - d) / 2, ux = dx/d, uy = dy/d;
        pos[i].x -= ux*push; pos[i].y -= uy*push; pos[j].x += ux*push; pos[j].y += uy*push; moved = true;
      }
    }
    if(!moved) break;
  }

  drawTowns(svg, vb, fs * 0.95, pos, r, false);

  pos.forEach(pp => {
    const c = pp.c;
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", "grp"); g.dataset.id = c.id;
    const circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", pp.x); circle.setAttribute("cy", pp.y); circle.setAttribute("r", r);
    circle.setAttribute("class", "dot"); circle.dataset.id = c.id;
    const num = document.createElementNS(svgNS, "text");
    num.setAttribute("x", pp.x); num.setAttribute("y", pp.y + fs*0.36);
    num.setAttribute("font-size", fs); num.setAttribute("class", "num");
    num.textContent = c.num;
    g.appendChild(circle); g.appendChild(num);
    g.addEventListener("click", () => { toggleVisited(c.id); showInfo(c.id); });
    svg.appendChild(g);
  });
}

function buildHomeMap(){
  const svg = document.getElementById("map-home");
  const svgNS = "http://www.w3.org/2000/svg";
  const shape = document.createElementNS(svgNS, "polygon");
  shape.setAttribute("points", OUTLINE); shape.setAttribute("class", "outline");
  svg.appendChild(shape);
  // one clickable group per region, so a tap anywhere on its dots opens that tab
  REGIONS.filter(r => r.id !== "home").forEach(r => {
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", "home-region"); g.dataset.region = r.id;
    const rs = sitesIn(r.id);
    const hit = document.createElementNS(svgNS, "rect");
    const hx = Math.min(...rs.map(c => c.x)) - 18, hy = Math.min(...rs.map(c => c.y)) - 24;
    hit.setAttribute("x", hx); hit.setAttribute("y", hy);
    hit.setAttribute("width", Math.max(...rs.map(c => c.x)) - hx + 18); hit.setAttribute("height", Math.max(...rs.map(c => c.y)) - hy + 18);
    hit.setAttribute("class", "hit");
    g.appendChild(hit);
    sitesIn(r.id).forEach(c => {
      const circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", c.x); circle.setAttribute("cy", c.y); circle.setAttribute("r", 5);
      circle.setAttribute("class", "dot"); circle.dataset.id = c.id;
      g.appendChild(circle);
    });
    const LABEL_POS = { north:[262,235], mid:[100,470], se:[300,552], sw:[78,602] };
    const [lx, ly] = LABEL_POS[r.id];
    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("x", lx); label.setAttribute("y", ly); label.setAttribute("class", "region-lbl");
    label.textContent = r.name;
    g.appendChild(label);
    g.addEventListener("click", () => switchTab(r.id));
    svg.appendChild(g);
  });
  const lblBoxes = [[262,235,"North"],[100,470,"Midlands"],[300,552,"South East"],[78,602,"South West"]].map(l => ({x:l[0] - l[2].length*3.6, y:l[1] - 12, w:l[2].length*7.2, h:16}));
  const allDots = REGIONS.filter(r => r.id !== "home").flatMap(r => sitesIn(r.id)).map(c => ({x:c.x, y:c.y}));
  drawTowns(svg, [0,0,350,660], 12, allDots, 9, true, lblBoxes);
}

/* ---------- interaction ---------- */
function switchTab(id){
  activeTab = id;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === id));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + id));
  window.scrollTo({top:0, behavior:"instant"});
}
function toggleVisited(id){
  if(visited[id]) delete visited[id]; else visited[id] = true;
  save(); render();
}
function showInfo(id){
  const c = SITES.find(s => s.id === id);
  const region = c.region;
  document.querySelectorAll("li.selected, .grp.selected").forEach(el => el.classList.remove("selected"));
  document.querySelectorAll('li[data-id="' + id + '"], .grp[data-id="' + id + '"]').forEach(el => el.classList.add("selected"));
  const card = document.getElementById("info-" + region);
  if(!card) return;
  const v = isVisited(id);
  card.innerHTML =
    '<button class="info-close" aria-label="Close">×</button>' +
    (c.num ? '<span class="badge' + (v ? ' v' : '') + '">' + c.num + '</span>' : '') + '<span class="info-name">' + c.name + '</span><span class="info-status ' + (v ? "v" : "u") + '">' + (v ? "Seen" : "Still to see") + '</span>' +
    '<div class="info-meta">' + c.city + ' · ' + c.year + (milesTo(c) != null ? ' · <span class="dist">' + fmtMiles(milesTo(c)) + ' away</span>' : '') + '</div>' +
    '<div>' + c.highlight + '</div>' +
    (c.image ? '<img class="info-image" src="' + c.image + '" alt="' + c.name + '">' : '') +
    '<div class="links"><a href="' + photoLink(c) + '" target="_blank" rel="noopener">See photos ↗</a>' +
    (c.link ? ' · <a href="' + c.link + '" target="_blank" rel="noopener">Website ↗</a>' : '') +
    (c.abroad ? '' : ' · <a href="' + directionsLink(c) + '" target="_blank" rel="noopener">Directions ↗</a>') + '</div>';
  card.querySelectorAll(".links a").forEach(a => a.addEventListener("click", ev => openLink(ev, a.href)));
  card.querySelector(".info-close").addEventListener("click", () => {
    card.innerHTML = '<div class="info-empty">Tap a window to see its story.</div>';
    document.querySelectorAll("li.selected, .grp.selected").forEach(el => el.classList.remove("selected"));
  });
  card.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function makeRow(c){
  const li = document.createElement("li");
  li.dataset.id = c.id;
  const v = isVisited(c.id);
  if(v) li.classList.add("is-seen");
  li.innerHTML =
    '<span class="entry"><span class="nm">' + (c.num ? '<span class="badge">' + c.num + '</span>' : '') + c.name + '<span class="city">' + c.city + ' · ' + c.year + (milesTo(c) != null ? ' · <span class="dist">' + fmtMiles(milesTo(c)) + '</span>' : '') + '</span></span>' +
    '<span class="hl">' + c.highlight + '</span>' +
    '<span class="links"><a href="' + photoLink(c) + '" target="_blank" rel="noopener">See photos ↗</a>' + (c.abroad ? '' : ' · <a href="' + directionsLink(c) + '" target="_blank" rel="noopener">Directions ↗</a>') + '</span></span>' +
    '<span class="mark">' + (v ? "remove" : "mark seen") + '</span>';
  li.addEventListener("click", () => showInfo(c.id));
  li.querySelectorAll(".links a").forEach(a => a.addEventListener("click", ev => { ev.stopPropagation(); openLink(ev, ev.currentTarget.href); }));
  li.querySelector(".mark").addEventListener("click", ev => { ev.stopPropagation(); toggleVisited(c.id); });
  return li;
}

function render(){
  const total = SITES.length;
  const seenTotal = SITES.filter(s => isVisited(s.id)).length;
  document.getElementById("homeCount").textContent = seenTotal;
  document.getElementById("homeBar").style.width = (100*seenTotal/total) + "%";
  document.getElementById("tabcount-home").textContent = seenTotal + " / " + total;

  REGIONS.filter(r => r.id !== "home").forEach(r => {
    const sites = sitesIn(r.id).sort((a,b) => (sortNearest && userPos) ? milesTo(a) - milesTo(b) : (b.year - a.year || a.name.localeCompare(b.name)));
    const seen = sites.filter(s => isVisited(s.id)), togo = sites.filter(s => !isVisited(s.id));
    document.getElementById("tabcount-" + r.id).textContent = seen.length + " / " + sites.length;
    document.getElementById("rc-count-" + r.id).textContent = seen.length + " of " + sites.length + " seen";
    document.getElementById("rc-bar-" + r.id).style.width = (100*seen.length/sites.length) + "%";
    document.getElementById("seen-count-" + r.id).textContent = seen.length + (seen.length === 1 ? " window" : " windows");
    document.getElementById("togo-count-" + r.id).textContent = togo.length + (togo.length === 1 ? " window" : " windows");
    const sl = document.getElementById("seen-" + r.id), tl = document.getElementById("togo-" + r.id);
    sl.innerHTML = ""; tl.innerHTML = "";
    if(!seen.length) sl.innerHTML = '<li class="empty">None yet in this region.</li>';
    seen.forEach(c => sl.appendChild(makeRow(c)));
    if(!togo.length) tl.innerHTML = '<li class="empty">You have seen every window in this region.</li>';
    togo.forEach(c => tl.appendChild(makeRow(c)));
    sites.forEach(c => {
      const dot = document.querySelector('#map-' + r.id + ' circle[data-id="' + c.id + '"]');
      if(dot) dot.classList.toggle("visited", isVisited(c.id));
    });
  });

  document.querySelectorAll('#map-home circle').forEach(dot => dot.classList.toggle("visited", isVisited(dot.dataset.id)));
  drawUserPin(document.getElementById("map-home"), false);
  REGIONS.filter(r => r.id !== "home").forEach(r => drawUserPin(document.getElementById("map-" + r.id), true));
  const near = document.getElementById("nearest");
  if(userPos){
    const togo = SITES.filter(c => !c.abroad && !isVisited(c.id)).sort((a,b) => milesTo(a) - milesTo(b)).slice(0,3);
    near.innerHTML = togo.length ? 'Nearest still to see: ' + togo.map(c => '<b>' + c.name + '</b> (' + fmtMiles(milesTo(c)) + ')').join(', ') : '';
  } else near.innerHTML = "";

  const al = document.getElementById("list-abroad");
  al.innerHTML = "";
  sitesIn("abroad").sort((a,b) => b.year - a.year).forEach(c => {
    al.appendChild(makeRow(c));
  });
}

loadState();
</script>
</body>
</html>
